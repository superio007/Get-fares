<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Offer</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
    }
    .offer-container {
        background-color: #fff;
        border: 1px solid #ccc;
        padding: 20px;
        max-width: 600px;
        margin: 20px auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .price {
        font-size: 24px;
        color: green;
    }
    .details {
        margin-top: 10px;
    }
    .flight-info {
        margin: 10px 0;
        padding: 10px;
        background-color: #f9f9f9;
        border-left: 5px solid #333;
    }
    .button {
        background-color: #ff9900;
        color: white;
        padding: 10px 20px;
        text-align: center;
        display: inline-block;
        border: none;
        cursor: pointer;
        margin-top: 20px;
    }
</style>
</head>
<body>
<div class="offer-container">
    <div class="price">$42.00 - Adult price: 1x Adults - $42.00</div>
    <div class="details">
        <div class="flight-info">
            <strong>Outbound Publish fare (ECONOMY BASIC)</strong>
            <p><strong>Depart:</strong> 04:30 31.07.2024 BOM</p>
            <p><strong>Arrive:</strong> 06:05 31.07.2024 AUH - 3h 5m</p>
            <p><strong>Continue:</strong> 07:20 31.07.2024 AUH</p>
            <p><strong>Final:</strong> 09:20 31.07.2024 XNB - 2h 0m</p>
            <p>At least 7 seats available</p>
        </div>
        <button class="button">Book this offer</button>
    </div>
</div>
</body>
</html>
